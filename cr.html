<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>キャラルーレット30</title>
  <style>
    :root{
      --bg1:#fff8e8;
      --bg2:#eaf7ff;
      --ink:#243044;
      --card:rgba(255,255,255,.86);
      --shadow:0 18px 45px rgba(35,48,68,.16);
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:ui-rounded,"Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;color:var(--ink);background:linear-gradient(145deg,var(--bg1),var(--bg2));}
    body{min-height:100svh;display:grid;place-items:center;padding:18px;overflow-x:hidden}
    .app{width:min(960px,100%);display:grid;gap:16px;justify-items:center}
    h1{margin:0;font-size:clamp(28px,6vw,48px);letter-spacing:.06em;text-align:center}
    .sub{margin:-4px 0 4px;opacity:.7;font-weight:700;text-align:center}
    .stage{width:100%;display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:18px;align-items:center}
    .wheel-card,.info-card{background:var(--card);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.8);box-shadow:var(--shadow);border-radius:30px;padding:18px}
    .wheel-wrap{position:relative;aspect-ratio:1/1;width:min(100%,620px);margin:auto}
    canvas{display:block;width:100%;height:100%;filter:drop-shadow(0 12px 22px rgba(30,42,60,.16))}
    .pointer{position:absolute;left:50%;top:-4px;transform:translateX(-50%);width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-top:34px solid #ff4f6d;filter:drop-shadow(0 4px 4px rgba(0,0,0,.15));z-index:3}
    .center{position:absolute;inset:50% auto auto 50%;transform:translate(-50%,-50%);width:28%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:white;border:7px solid rgba(255,255,255,.9);box-shadow:0 8px 28px rgba(0,0,0,.15);font-weight:900;font-size:clamp(18px,4vw,32px);pointer-events:none}
    .controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:16px}
    button{border:0;border-radius:999px;padding:15px 26px;font:inherit;font-weight:900;font-size:18px;cursor:pointer;box-shadow:0 8px 18px rgba(0,0,0,.12);transition:transform .15s ease,box-shadow .15s ease,opacity .15s}
    button:hover{transform:translateY(-1px);box-shadow:0 12px 22px rgba(0,0,0,.16)}
    button:active{transform:translateY(2px)}
    button:disabled{opacity:.55;cursor:not-allowed}
    #spinBtn{background:#ff4f6d;color:white;min-width:170px}
    #againBtn{background:#fff;color:var(--ink)}
    .info-card{align-self:stretch;display:flex;flex-direction:column;gap:12px}
    .info-card h2{margin:0;font-size:20px}
    .legend{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .tag{border-radius:14px;padding:10px 9px;font-size:13px;font-weight:900;text-align:center;background:#fff}
    .tip{font-size:14px;line-height:1.6;opacity:.76;margin-top:auto}
    .mini-list{display:grid;gap:6px;max-height:380px;overflow:auto;padding-right:4px}
    .mini{display:flex;align-items:center;gap:8px;background:#fff;border-radius:14px;padding:8px 10px;font-weight:800;font-size:13px}
    .dot{width:22px;height:22px;border-radius:50%;flex:0 0 auto;position:relative;box-shadow:inset 0 -2px 0 rgba(0,0,0,.08)}
    .dot::before,.dot::after{content:"";position:absolute;width:3px;height:5px;border-radius:50%;background:#253044;top:6px}
    .dot::before{left:6px}.dot::after{right:6px}

    .result{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.96),rgba(230,246,255,.96));opacity:0;pointer-events:none;transition:opacity .25s ease;padding:22px;text-align:center}
    .result.show{opacity:1;pointer-events:auto}
    .result-inner{display:grid;justify-items:center;gap:16px;animation:pop .6s cubic-bezier(.2,.95,.2,1.1)}
    @keyframes pop{0%{transform:scale(.3) rotate(-6deg);opacity:0}65%{transform:scale(1.08) rotate(2deg);opacity:1}100%{transform:scale(1) rotate(0)}}
    .big-face{width:min(62vw,420px);aspect-ratio:1;border-radius:50%;position:relative;box-shadow:0 24px 70px rgba(22,49,72,.24),inset 0 -16px 0 rgba(0,0,0,.06);animation:float 1.1s ease-in-out infinite alternate}
    @keyframes float{from{transform:translateY(0)}to{transform:translateY(-12px)}}
    .eye{position:absolute;top:36%;width:6%;height:9%;border-radius:50%;background:#263044}.eye.l{left:31%}.eye.r{right:31%}
    .mouth{position:absolute;left:50%;top:53%;transform:translateX(-50%);width:12%;height:7%;border:5px solid #263044;border-top:0;border-left-color:transparent;border-right-color:transparent;border-radius:0 0 50% 50%}
    .cheek{position:absolute;top:49%;width:11%;height:5%;border-radius:50%;background:rgba(255,110,135,.35)}.cheek.l{left:16%}.cheek.r{right:16%}
    .result-name{font-size:clamp(36px,8vw,68px);font-weight:1000;letter-spacing:.03em;text-wrap:balance}
    .result-group{font-size:18px;font-weight:900;opacity:.65}
    .result-close{background:#ff4f6d;color:white;margin-top:6px}
    .spark{position:fixed;width:10px;height:10px;border-radius:3px;pointer-events:none;z-index:30;animation:spark 900ms ease-out forwards}
    @keyframes spark{0%{transform:translate(0,0) rotate(0) scale(1);opacity:1}100%{transform:translate(var(--x),var(--y)) rotate(360deg) scale(.15);opacity:0}}
    footer{font-size:12px;opacity:.55;text-align:center;line-height:1.5}
    @media(max-width:780px){
      .stage{grid-template-columns:1fr}
      .info-card{display:none}
      .wheel-card{padding:12px;border-radius:24px}
      body{padding:12px}
    }
  </style>
</head>
<body>
  <main class="app">
    <div>
      <h1>キャラルーレット30</h1>
      <p class="sub">まわして、だれが出るかな？</p>
    </div>

    <section class="stage">
      <div class="wheel-card">
        <div class="wheel-wrap">
          <div class="pointer" aria-hidden="true"></div>
          <canvas id="wheel" width="900" height="900" aria-label="30キャラのルーレット"></canvas>
          <div class="center">GO!</div>
        </div>
        <div class="controls">
          <button id="spinBtn">まわす！</button>
          <button id="againBtn" type="button">シャッフル</button>
        </div>
      </div>

      <aside class="info-card">
        <h2>30キャラ</h2>
        <div class="legend">
          <div class="tag">ちいかわ 8</div>
          <div class="tag">サンリオ 8</div>
          <div class="tag">ポケモン 9</div>
          <div class="tag">マイクラ 5</div>
        </div>
        <div class="mini-list" id="miniList"></div>
        <div class="tip">画像は使わず、名前・色・丸い顔だけで遊べるようにしています。</div>
      </aside>
    </section>

    <footer>
      ファンメイドの遊び用ミニアプリです。各キャラクター名・作品名の権利はそれぞれの権利者に帰属します。
    </footer>
  </main>

  <section class="result" id="result" aria-hidden="true">
    <div class="result-inner">
      <div class="big-face" id="bigFace" aria-hidden="true">
        <span class="eye l"></span><span class="eye r"></span>
        <span class="cheek l"></span><span class="cheek r"></span>
        <span class="mouth"></span>
      </div>
      <div class="result-name" id="resultName"></div>
      <div class="result-group" id="resultGroup"></div>
      <button class="result-close" id="closeResult">もういっかい！</button>
    </div>
  </section>

<script>
  const characters = [
    {name:'ちいかわ', group:'ちいかわ', color:'#ffe4ea'},
    {name:'ハチワレ', group:'ちいかわ', color:'#dff4ff'},
    {name:'うさぎ', group:'ちいかわ', color:'#fff0a8'},
    {name:'モモンガ', group:'ちいかわ', color:'#efe3ff'},
    {name:'くりまんじゅう', group:'ちいかわ', color:'#e8b978'},
    {name:'ラッコ', group:'ちいかわ', color:'#bfe7df'},
    {name:'シーサー', group:'ちいかわ', color:'#ffd39e'},
    {name:'古本屋', group:'ちいかわ', color:'#d7f0c8'},

    {name:'ハローキティ', group:'サンリオ', color:'#ffcad6'},
    {name:'マイメロディ', group:'サンリオ', color:'#ffc2df'},
    {name:'クロミ', group:'サンリオ', color:'#cbb8ff'},
    {name:'シナモロール', group:'サンリオ', color:'#d9f5ff'},
    {name:'ポムポムプリン', group:'サンリオ', color:'#ffe08a'},
    {name:'ポチャッコ', group:'サンリオ', color:'#f3f3f3'},
    {name:'けろけろけろっぴ', group:'サンリオ', color:'#bceca6'},
    {name:'ハンギョドン', group:'サンリオ', color:'#9de3e6'},

    {name:'ピカチュウ', group:'ポケモン', color:'#ffe34d'},
    {name:'イーブイ', group:'ポケモン', color:'#c89563'},
    {name:'ニャオハ', group:'ポケモン', color:'#9fe3a8'},
    {name:'ホゲータ', group:'ポケモン', color:'#ff8d74'},
    {name:'クワッス', group:'ポケモン', color:'#b8e4ff'},
    {name:'リザードン', group:'ポケモン', color:'#f6a05d'},
    {name:'ゲンガー', group:'ポケモン', color:'#9b7bdb'},
    {name:'カビゴン', group:'ポケモン', color:'#6dc0b7'},
    {name:'プリン', group:'ポケモン', color:'#ffbadb'},

    {name:'スティーブ', group:'マイクラ', color:'#6fb3c8'},
    {name:'アレックス', group:'マイクラ', color:'#d88c56'},
    {name:'クリーパー', group:'マイクラ', color:'#79c85a'},
    {name:'エンダーマン', group:'マイクラ', color:'#6b5a8e'},
    {name:'ゾンビ', group:'マイクラ', color:'#78a97c'}
  ];

  const canvas = document.getElementById('wheel');
  const ctx = canvas.getContext('2d');
  const spinBtn = document.getElementById('spinBtn');
  const againBtn = document.getElementById('againBtn');
  const result = document.getElementById('result');
  const resultName = document.getElementById('resultName');
  const resultGroup = document.getElementById('resultGroup');
  const bigFace = document.getElementById('bigFace');
  const closeResult = document.getElementById('closeResult');
  const miniList = document.getElementById('miniList');

  let items = [...characters];
  let rotation = 0;
  let spinning = false;

  function shuffle(arr){
    const a = [...arr];
    for(let i=a.length-1;i>0;i--){
      const r = new Uint32Array(1);
      crypto.getRandomValues(r);
      const j = r[0] % (i+1);
      [a[i],a[j]]=[a[j],a[i]];
    }
    return a;
  }

  function drawWheel(){
    const w = canvas.width, h = canvas.height;
    const cx = w/2, cy = h/2, r = w*0.47;
    ctx.clearRect(0,0,w,h);
    ctx.save();
    ctx.translate(cx,cy);
    ctx.rotate(rotation);
    const step = Math.PI*2/items.length;

    for(let i=0;i<items.length;i++){
      const start = -Math.PI/2 - step/2 + i*step;
      const end = start + step;
      ctx.beginPath();
      ctx.moveTo(0,0);
      ctx.arc(0,0,r,start,end);
      ctx.closePath();
      ctx.fillStyle = items[i].color;
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = 'rgba(255,255,255,.95)';
      ctx.stroke();

      ctx.save();
      ctx.rotate(start + step/2);
      ctx.translate(r*0.68,0);
      ctx.rotate(Math.PI/2);
      ctx.fillStyle = '#243044';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = '900 22px "Hiragino Maru Gothic ProN","Yu Gothic",sans-serif';
      const label = items[i].name.length > 8 ? items[i].name.slice(0,8)+'…' : items[i].name;
      ctx.fillText(label,0,0);
      ctx.restore();
    }

    ctx.beginPath();
    ctx.arc(0,0,r,0,Math.PI*2);
    ctx.lineWidth=8;
    ctx.strokeStyle='#fff';
    ctx.stroke();
    ctx.restore();
  }

  function renderMiniList(){
    miniList.innerHTML='';
    items.forEach(c=>{
      const row=document.createElement('div');
      row.className='mini';
      row.innerHTML=`<span class="dot" style="background:${c.color}"></span><span>${c.name}</span>`;
      miniList.appendChild(row);
    });
  }

  function randIndex(max){
    const r = new Uint32Array(1);
    crypto.getRandomValues(r);
    return r[0] % max;
  }

  function easeOutCubic(t){return 1-Math.pow(1-t,3)}

  function spin(){
    if(spinning) return;
    spinning=true;
    spinBtn.disabled=true;
    againBtn.disabled=true;

    const winnerIndex = randIndex(items.length);
    const step = Math.PI*2/items.length;
    const current = ((rotation%(Math.PI*2))+(Math.PI*2))%(Math.PI*2);
    const targetBase = -winnerIndex*step;
    let delta = ((targetBase-current)%(Math.PI*2)+(Math.PI*2))%(Math.PI*2);
    const turns = 6 + randIndex(4);
    delta += turns*Math.PI*2;

    const startRot=rotation;
    const duration=4200;
    const start=performance.now();

    function frame(now){
      const t=Math.min(1,(now-start)/duration);
      rotation=startRot+delta*easeOutCubic(t);
      drawWheel();
      if(t<1){
        requestAnimationFrame(frame);
      }else{
        rotation = targetBase;
        drawWheel();
        setTimeout(()=>showResult(items[winnerIndex]),180);
      }
    }
    requestAnimationFrame(frame);
  }

  function showResult(char){
    resultName.textContent=char.name;
    resultGroup.textContent=char.group;
    bigFace.style.background=char.color;
    result.classList.add('show');
    result.setAttribute('aria-hidden','false');
    makeSparks(char.color);
  }

  function hideResult(){
    result.classList.remove('show');
    result.setAttribute('aria-hidden','true');
    spinning=false;
    spinBtn.disabled=false;
    againBtn.disabled=false;
  }

  function makeSparks(baseColor){
    const colors=[baseColor,'#ffcf4a','#ff6b8a','#7bdff2','#b2f7a7','#ffffff'];
    for(let i=0;i<34;i++){
      const s=document.createElement('i');
      s.className='spark';
      s.style.left='50vw';
      s.style.top='46vh';
      s.style.background=colors[i%colors.length];
      const ang=Math.random()*Math.PI*2;
      const dist=140+Math.random()*320;
      s.style.setProperty('--x',`${Math.cos(ang)*dist}px`);
      s.style.setProperty('--y',`${Math.sin(ang)*dist}px`);
      s.style.animationDelay=`${Math.random()*120}ms`;
      document.body.appendChild(s);
      setTimeout(()=>s.remove(),1200);
    }
  }

  spinBtn.addEventListener('click',spin);
  closeResult.addEventListener('click',hideResult);
  result.addEventListener('click',(e)=>{if(e.target===result) hideResult()});
  againBtn.addEventListener('click',()=>{
    if(spinning) return;
    items=shuffle(items);
    rotation=0;
    renderMiniList();
    drawWheel();
  });

  renderMiniList();
  drawWheel();
</script>
</body>
</html>
